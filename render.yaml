services:
  # 1. Main Web API Service (Django) - Free Tier
  - type: web
    name: shivam-kirana-backend
    env: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn store_backend.wsgi:application --workers 2 --threads 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # User will paste their Neon connection string here
      - key: ALLOWED_HOSTS
        value: "*" # Can restrict to specific domains later
      - key: CORS_ALLOWED_ORIGINS
        value: "https://frontend-woad-eta-27.vercel.app" # Default to our deployed Vercel frontend
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.vercel.app"
      - key: CONN_MAX_AGE
        value: "600"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        value: "whatsapp:+14155238886"
